# .github/workflows/frostagent-sarif.yml : findings appear in the Security tab
name: frostagent code scanning
on: [push, pull_request]
permissions:
  security-events: write
  contents: read
jobs:
  frostagent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: keithadler/frostagent@v0.1
        with:
          args: --format sarif --exit-zero > frostagent.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: frostagent.sarif
